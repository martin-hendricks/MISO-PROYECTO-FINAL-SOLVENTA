coverage:
  status:
    # Cobertura mínima exigida: 80 %. Por debajo de ese valor el check falla.
    project:
      default:
        target: 80%
      backend:
        flags:
          - backend
        target: 80%
      web:
        flags:
          - web
        target: 80%
      mobile:
        flags:
          - mobile
        target: 80%
    # El código nuevo o modificado en el PR también debe tener al menos 80 %.
    patch:
      default:
        target: 80%

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: backend
      paths:
        - apps/backend/.*
      carryforward: true
    - name: web
      paths:
        - apps/web/.*
      carryforward: true
    - name: mobile
      paths:
        - apps/mobile/.*
      carryforward: true
