# Orquesta todo el backend de Solventa en local: una base Postgres por
# microservicio (mismo patrón que cada docker-compose.yml individual, solo
# que aquí conviven todos a la vez) + api-socios y bff-web hablando con el
# núcleo real por red interna de Docker, igual que harían vía Service de
# Kubernetes en el cluster real.
#
# Uso:
#   infra/scripts/levantar-local.sh
#   (equivalente a `docker compose up -d --build` + aplicar las migraciones
#   de cada servicio que falten -- ver el propio script para el por qué.
#   Un `docker compose up -d --build` manual también funciona para un
#   volumen nuevo, pero no reaplica migraciones en un volumen ya existente.)
#   docker compose down -v   (-v: también borra los volúmenes de datos)
#
# Puertos expuestos al host (para pegarle desde curl/Postman):
#   8000 bff-web         8001 ms-suscripcion   8002 ms-pagos
#   8003 ms-polizas      8004 ms-perfilamiento 8005 ms-siniestros
#   8006 api-socios      8007 bff-movil        8009 ms-cotizacion
#   8010 ms-identidad    8011 ms-consentimiento  8012 notificaciones
#   4566 S3 local (LocalStack, evidencia de siniestros)
#   8008 grafana (admin/admin, o anónimo como Viewer) · 9090 prometheus
#
# bff-web queda en :8000 a propósito: apps/web/proxy.conf.json (el dev
# server de Angular, "pnpm start") reenvía /web -> http://localhost:8000/v1
# -- ver apps/web/src/app/core/api/api-base-url.ts. Si corres el frontend en
# local contra este compose, no cambies ese mapeo.
#
# bff-movil y bff-web son pares: ambos llaman al núcleo y ninguno llama al
# otro. Observabilidad (ver ./observability/): mismas métricas de negocio
# que infra/k8s/platform/observability/, con Prometheus apuntando a targets
# estáticos (sin kubernetes_sd_configs -- no hay API server que preguntar).
#
# Ambiente de integración con dobles (HU-88): ningún servicio llama a un
# tercero real. Open Finance, Open Data, perfil de riesgo, KYC y pasarela
# son dobles detrás de sus adaptadores. Su demora (ms) y su caída se fuerzan
# desde el entorno al levantar, sin tocar este archivo:
#   DOBLE_OPEN_FINANCE_LATENCIA_MS=1000 docker compose up -d   (degrada HU-56)
#   DOBLE_PERFIL_RIESGO_FALLAR=true docker compose up -d       (degrada HU-5)
#   DOBLE_KYC_FALLAR=true / DOBLE_PASARELA_FALLAR=true         (alta / cobro en 503)
#   DOBLE_KYC_DOCUMENTOS_RECHAZADOS=0000000000,123             (alta en 422)

services:
  db-cotizacion:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ms-cotizacion/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solventa"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-suscripcion:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ms-suscripcion/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solventa"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-pagos:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ms-pagos/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solventa"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-polizas:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ms-polizas/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solventa"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-perfilamiento:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ms-perfilamiento/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solventa"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-siniestros:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ms-siniestros/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solventa"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-identidad:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ms-identidad/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solventa"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-consentimiento:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ms-consentimiento/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solventa"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-notificaciones:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./notificaciones/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solventa"]
      interval: 2s
      timeout: 3s
      retries: 20

  ms-cotizacion:
    build:
      context: ./ms-cotizacion
      target: runtime
    environment:
      SERVICE_NAME: ms-cotizacion
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-cotizacion:5432/solventa
      # Default roto en app/config.py (http://ms-suscripcion:8000, pero
      # ms-suscripcion escucha en :8080) -- se sobreescribe aquí explícito.
      MS_SUSCRIPCION_URL: http://ms-suscripcion:8080
      DOBLE_PERFIL_RIESGO_LATENCIA_MS: ${DOBLE_PERFIL_RIESGO_LATENCIA_MS:-0}
      DOBLE_PERFIL_RIESGO_FALLAR: ${DOBLE_PERFIL_RIESGO_FALLAR:-false}
      MS_PERFILAMIENTO_URL: http://ms-perfilamiento:8080
      SOLVENTA_TOKEN_SECRET: clave-local-de-pruebas-no-usar-en-produccion
    ports:
      - "8009:8000"
    depends_on:
      db-cotizacion:
        condition: service_healthy

  ms-suscripcion:
    build:
      context: ./ms-suscripcion
      target: runtime
    environment:
      SERVICE_NAME: ms-suscripcion
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-suscripcion:5432/solventa
    ports:
      - "8001:8080"
    depends_on:
      db-suscripcion:
        condition: service_healthy

  ms-pagos:
    build:
      context: ./ms-pagos
      target: runtime
    environment:
      SERVICE_NAME: ms-pagos
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-pagos:5432/solventa
      MS_SUSCRIPCION_URL: http://ms-suscripcion:8080
      DOBLE_PASARELA_LATENCIA_MS: ${DOBLE_PASARELA_LATENCIA_MS:-0}
      DOBLE_PASARELA_FALLAR: ${DOBLE_PASARELA_FALLAR:-false}
    ports:
      - "8002:8080"
    depends_on:
      db-pagos:
        condition: service_healthy

  ms-polizas:
    build:
      context: ./ms-polizas
      target: runtime
    environment:
      SERVICE_NAME: ms-polizas
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-polizas:5432/solventa
      DATABASE_URL_READ: postgresql+asyncpg://postgres:postgres@db-polizas:5432/solventa
      MS_SUSCRIPCION_URL: http://ms-suscripcion:8080
      MS_PAGOS_URL: http://ms-pagos:8080
      SOLVENTA_TOKEN_SECRET: clave-local-de-pruebas-no-usar-en-produccion
    ports:
      - "8003:8080"
    depends_on:
      db-polizas:
        condition: service_healthy

  ms-perfilamiento:
    build:
      context: ./ms-perfilamiento
      target: runtime
    environment:
      SERVICE_NAME: ms-perfilamiento
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-perfilamiento:5432/solventa
      DOBLE_OPEN_FINANCE_LATENCIA_MS: ${DOBLE_OPEN_FINANCE_LATENCIA_MS:-0}
      DOBLE_OPEN_FINANCE_FALLAR: ${DOBLE_OPEN_FINANCE_FALLAR:-false}
      DOBLE_OPEN_DATA_LATENCIA_MS: ${DOBLE_OPEN_DATA_LATENCIA_MS:-0}
      DOBLE_OPEN_DATA_FALLAR: ${DOBLE_OPEN_DATA_FALLAR:-false}
    ports:
      - "8004:8080"
    depends_on:
      db-perfilamiento:
        condition: service_healthy

  ms-siniestros:
    build:
      context: ./ms-siniestros
      target: runtime
    environment:
      SERVICE_NAME: ms-siniestros
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-siniestros:5432/solventa
      SOLVENTA_TOKEN_SECRET: clave-local-de-pruebas-no-usar-en-produccion
      # Evidencia de siniestros (HU-157) en el doble de S3. El navegador abre las URLs
      # firmadas contra localhost:4566 (S3_ENDPOINT_PUBLICO), no contra el host interno.
      S3_EVIDENCIAS_BUCKET: solventa-local-evidencias-siniestros
      S3_ENDPOINT_URL: http://s3-local:4566
      S3_ENDPOINT_PUBLICO: http://localhost:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_CREAR_BUCKET: "true"
    ports:
      - "8005:8080"
    depends_on:
      db-siniestros:
        condition: service_healthy
      s3-local:
        condition: service_healthy

  # Doble de S3 (LocalStack, solo el servicio s3) para la evidencia de siniestros. En AWS
  # es el bucket del módulo terraform s3_evidencias, con credenciales por IRSA.
  s3-local:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  ms-identidad:
    build:
      context: ./ms-identidad
      target: runtime
    environment:
      SERVICE_NAME: ms-identidad
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-identidad:5432/solventa
      DOBLE_KYC_LATENCIA_MS: ${DOBLE_KYC_LATENCIA_MS:-0}
      DOBLE_KYC_FALLAR: ${DOBLE_KYC_FALLAR:-false}
      DOBLE_KYC_DOCUMENTOS_RECHAZADOS: ${DOBLE_KYC_DOCUMENTOS_RECHAZADOS:-}
      SOLVENTA_TOKEN_SECRET: clave-local-de-pruebas-no-usar-en-produccion
    ports:
      - "8010:8080"
    depends_on:
      db-identidad:
        condition: service_healthy

  ms-consentimiento:
    build:
      context: ./ms-consentimiento
      target: runtime
    environment:
      SERVICE_NAME: ms-consentimiento
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-consentimiento:5432/solventa
    ports:
      - "8011:8080"
    depends_on:
      db-consentimiento:
        condition: service_healthy

  notificaciones:
    build:
      context: ./notificaciones
      target: runtime
    environment:
      SERVICE_NAME: notificaciones
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-notificaciones:5432/solventa
      SOLVENTA_TOKEN_SECRET: clave-local-de-pruebas-no-usar-en-produccion
      PUSH_PROVEEDOR: ${PUSH_PROVEEDOR:-stub}
      FCM_CREDENCIALES_JSON: '${FCM_CREDENCIALES_JSON:-}'
      PUSH_STUB_FALLAR: ${PUSH_STUB_FALLAR:-false}
    ports:
      - "8012:8080"
    depends_on:
      db-notificaciones:
        condition: service_healthy

  api-socios:
    build:
      context: .
      dockerfile: ./api-socios/Dockerfile
      target: runtime
    environment:
      SERVICE_NAME: api-socios
      MS_COTIZACION_URL: http://ms-cotizacion:8000
      MS_IDENTIDAD_URL: http://ms-identidad:8080
      MS_PERFILAMIENTO_URL: http://ms-perfilamiento:8080
      SOLVENTA_TOKEN_SECRET: clave-local-de-pruebas-no-usar-en-produccion
    ports:
      - "8006:8080"
    depends_on:
      - ms-cotizacion
      - ms-identidad
      - ms-perfilamiento

  bff-web:
    build:
      context: ./bff-web
      target: runtime
    environment:
      SERVICE_NAME: bff-web
      SOLVENTA_TOKEN_SECRET: clave-local-de-pruebas-no-usar-en-produccion
      MS_COTIZACION_URL: http://ms-cotizacion:8000
      MS_PAGOS_URL: http://ms-pagos:8080
      MS_POLIZAS_URL: http://ms-polizas:8080
      MS_PERFILAMIENTO_URL: http://ms-perfilamiento:8080
      MS_SINIESTROS_URL: http://ms-siniestros:8080
      MS_SUSCRIPCION_URL: http://ms-suscripcion:8080
      MS_IDENTIDAD_URL: http://ms-identidad:8080
      MS_NOTIFICACIONES_URL: http://notificaciones:8080
    ports:
      - "8000:8000"
    depends_on:
      - ms-cotizacion
      - ms-pagos
      - ms-polizas
      - ms-perfilamiento
      - ms-siniestros
      - ms-suscripcion
      - ms-identidad
      - notificaciones

  bff-movil:
    build:
      context: ./bff-movil
      target: runtime
    environment:
      SERVICE_NAME: bff-movil
      SOLVENTA_TOKEN_SECRET: clave-local-de-pruebas-no-usar-en-produccion
      MS_COTIZACION_URL: http://ms-cotizacion:8000
      MS_PAGOS_URL: http://ms-pagos:8080
      MS_POLIZAS_URL: http://ms-polizas:8080
      MS_PERFILAMIENTO_URL: http://ms-perfilamiento:8080
      MS_SINIESTROS_URL: http://ms-siniestros:8080
      MS_SUSCRIPCION_URL: http://ms-suscripcion:8080
      MS_IDENTIDAD_URL: http://ms-identidad:8080
      MS_NOTIFICACIONES_URL: http://notificaciones:8080
    ports:
      - "8007:8000"
    depends_on:
      - ms-cotizacion
      - ms-pagos
      - ms-polizas
      - ms-perfilamiento
      - ms-siniestros
      - ms-suscripcion
      - ms-identidad
      - notificaciones

  # Observabilidad local: mismo stack que infra/k8s/platform/observability/
  # (Prometheus + Grafana con datasource/dashboards provisionados sin pasos
  # manuales), pero con targets estáticos en vez de kubernetes_sd_configs --
  # no hay API server de Kubernetes que preguntar en Docker Compose, mismo
  # enfoque que experiments/ha-01/ha-08. Las queries de los 2 dashboards de
  # negocio son idénticas a las de K8s (las métricas no cambian con la
  # plataforma); el dashboard de infraestructura es distinto porque aquí no
  # hay kube-state-metrics.
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "8008:3000"
    depends_on:
      - prometheus
