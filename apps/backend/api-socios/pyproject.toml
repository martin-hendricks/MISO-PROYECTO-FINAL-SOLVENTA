[project]
name = "api-socios"
version = "0.1.0"
description = "API de socios de Solventa: catálogo y cotización embebida para terceros (borde de canal, sin base de datos)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1.0",
  "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-socket>=0.7",
]

contract = [
  "pact-python>=2.2,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: excluida del workflow unitario",
  "contract: verificación Pact (HU-88); excluida del workflow unitario",
]

[tool.coverage.run]
branch = true
source = ["app"]
