# bff-web — BFF del portal Angular (Grupo B)
#
# Punto de entrada del tráfico web: recibe las peticiones que el ALB enruta
# desde CloudFront/API Gateway hacia la SPA. Baja carga computacional (agrega
# y transforma respuestas de los microservicios), pero necesita buena
# capacidad de réplicas porque multiplica el tráfico de usuarios finales.

nombre: bff-web

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-bff-web"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

# Diseño original: 3. 1 para el ambiente mínimo/demo: el Grupo B llegó a su
# límite real de memoria (17 réplicas deseadas entre los 8 servicios,
# bin-packing imperfecto del scheduler con solo 5-6 nodos t3.small --
# confirmado con pods en Pending indefinido aun con el sizing de cada pod
# ya correcto). bff-web es el de mayor footprint individual (384Mi) entre
# los que seguían en 3 réplicas; bajarlo da el margen real que faltaba sin
# tocar el sizing por pod. Ver también hpa.minReplicas y
# podDisruptionBudget más abajo.
replicas: 1
grupoEscalado: "b"

# apps/backend/bff-web/Dockerfile expone y arranca uvicorn en 8000 (mismo
# patrón que ms-cotizacion, no 8080 -- ver el comentario de puerto en
# infra/k8s/values/ms-cotizacion.yaml para el bug ya encontrado ahí).
puerto: 8000
puertoMetricas: 8000

recursos:
  requests:
    cpu: "300m"
    memory: "384Mi"
  limits:
    cpu: "700m"
    memory: "768Mi"

probes:
  # bff-web expone un único endpoint /health (apps/backend/bff-web/app/main.py),
  # sin distinguir liveness de readiness -- mismo patrón que ms-cotizacion.
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    habilitado: false

hpa:
  habilitado: true
  # Diseño original: 3. 1 para el ambiente mínimo/demo, acorde a replicas:
  # 1 más arriba.
  minReplicas: 1
  maxReplicas: 15
  targetCPU: 65
  targetMemory: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    - nombreRemoto: solventa-minimo-bff-web-token
      nombreLocal: bff-web-token
      # Sin `claves`: se usa dataFrom.extract, que proyecta el JSON del
      # secreto remoto tal cual -- su única clave ya se llama
      # SOLVENTA_TOKEN_SECRET (infra/terraform/modules/secrets/main.tf), así
      # que no hace falta mapear nombres.

serviceAccount:
  crear: true
  nombre: bff-web
  roleArn: ""

# Deshabilitado con replicas: 1: un PDB con minAvailable >= 1 bloquearía
# CUALQUIER operación de drenado (rollout, actualización de nodo), porque
# nunca se podría satisfacer con una sola réplica total -- y no hay
# redundancia real que proteger de todas formas. Diseño original:
# habilitado con minAvailable: 2, acorde a replicas: 3; reactivar junto
# con eso.
podDisruptionBudget:
  habilitado: false
  minAvailable: 2

topologySpread:
  habilitado: true
  maxSkew: 1

# Todos los microservicios de este Chart escuchan en :8080 (ver sus
# Dockerfile/Service, p.ej. kubectl get svc -n solventa), no en el 80 por
# defecto de HTTP que httpx.AsyncClient asume sin puerto explícito en la
# base_url -- mismo fix ya aplicado para MS_COTIZACION_URL (que sí escucha
# en :8000) y para MS_IDENTIDAD_URL en infra/k8s/values/api-socios.yaml.
# Sin el puerto, bff-web nunca llega al pod real y responde 503
# "servicio no disponible" aunque el servicio esté Running (confirmado en
# producción: POST /v1/registro fallaba así contra ms-identidad).
variablesEntorno:
  - nombre: MS_IDENTIDAD_URL
    valor: "http://ms-identidad.solventa.svc.cluster.local:8080"
  - nombre: MS_COTIZACION_URL
    valor: "http://ms-cotizacion.solventa.svc.cluster.local:8000"
  - nombre: MS_POLIZAS_URL
    valor: "http://ms-polizas.solventa.svc.cluster.local:8080"
  - nombre: MS_NOTIFICACIONES_URL
    valor: "http://notificaciones.solventa.svc.cluster.local:8080"
  - nombre: MS_SUSCRIPCION_URL
    valor: "http://ms-suscripcion.solventa.svc.cluster.local:8080"
  - nombre: MS_PAGOS_URL
    valor: "http://ms-pagos.solventa.svc.cluster.local:8080"
  - nombre: MS_PERFILAMIENTO_URL
    valor: "http://ms-perfilamiento.solventa.svc.cluster.local:8080"
  - nombre: MS_SINIESTROS_URL
    valor: "http://ms-siniestros.solventa.svc.cluster.local:8080"
