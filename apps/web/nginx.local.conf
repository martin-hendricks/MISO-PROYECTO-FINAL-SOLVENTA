# Override SOLO para desarrollo local.
#
# NO lo copia el Dockerfile: lo monta docker-compose.yml encima de
# /etc/nginx/conf.d/default.conf. La imagen desplegable lleva nginx.conf
# (solo SPA, sin dependencias externas), que es lo que producción necesita.
#
# El frontend arma sus URLs como /web/<ruta>
# (ver src/app/core/api/api-base-url.ts). Con `ng serve` eso lo resuelve
# proxy.conf.json; aquí lo resuelve nginx, reescribiendo /web/ -> /v1/.
# bff-web corre en el otro proyecto de compose (apps/backend) y se publica en
# el puerto 8000 del host -- el mismo que espera proxy.conf.json, así que los
# dos caminos usan el mismo origen. Se llega por host.docker.internal (ver
# extra_hosts en docker-compose.yml): son proyectos compose distintos y no
# comparten red, así que no hay nombre de servicio al cual resolver.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /web/ {
    proxy_pass http://host.docker.internal:8000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
