name: Backend unit tests
run-name: "[Backend] ${{ github.event.pull_request.title || github.ref_name }}"

on:
  pull_request:
    branches:
      - develop
      - main
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "release/**"
      - "hotfix/**"
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-unit-tests.yml"

jobs:
  unit-tests:
    name: backend-pytest
    runs-on: ubuntu-latest
    container:
      image: python:3.12.7-slim-bookworm
    steps:
      - name: Install job tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl gnupg ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select services
        id: select
        run: python apps/backend/scripts/select_services.py

      - name: Test service selector
        run: |
          python -m pip install pytest
          python -m pytest apps/backend/scripts/tests -p no:cacheprovider

      - name: Write skip reasons
        if: steps.select.outputs.skip != '[]'
        env:
          SKIP_JSON: ${{ steps.select.outputs.skip }}
        run: |
          python - <<'PY'
          import json
          import os

          skips = json.loads(os.environ["SKIP_JSON"])
          lines = ["## Optional domains skipped", ""]
          for item in skips:
              lines.append(f"- `{item['service']}`: {item['reason']}")
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Run selected services
        if: steps.select.outputs.matrix != '[]'
        env:
          SOLVENTA_TOKEN_SECRET: test-secret
          MATRIX_JSON: ${{ steps.select.outputs.matrix }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          services = json.loads(os.environ["MATRIX_JSON"])
          failed = False
          for service in services:
              work = os.path.join("apps", "backend", service)
              print(f"::group::{service}")
              venv = os.path.join(work, ".venv")
              created = subprocess.run([sys.executable, "-m", "venv", venv], cwd=work)
              python = os.path.join(venv, "bin", "python")
              install = subprocess.run(
                  [python, "-m", "pip", "install", "-e", ".[test]", "pytest-cov", "pytest-socket"],
                  cwd=work,
              )
              imported = subprocess.run(
                  [python, "-c", "from app.main import app"],
                  cwd=work,
              )
              if created.returncode != 0 or install.returncode != 0 or imported.returncode != 0:
                  failed = True
                  print("::endgroup::")
                  continue
              scan = subprocess.run(
                  ["grep", "-R", "--include=*.py", "-n", "sleep(", "tests"],
                  cwd=work,
              )
              if scan.returncode == 0:
                  print("sleep() is not allowed in unit tests")
                  failed = True
                  print("::endgroup::")
                  continue
              tested = subprocess.run(
                  [
                      python,
                      "-m",
                      "pytest",
                      "tests",
                      "-m",
                      "not integration and not contract",
                      "--allow-hosts=127.0.0.1,::1",
                      "--junitxml=junit.xml",
                      "--cov",
                      "--cov-report=term-missing",
                      "--cov-report=xml",
                  ],
                  cwd=work,
              )
              if tested.returncode != 0:
                  failed = True
              print("::endgroup::")
          sys.exit(1 if failed else 0)
          PY

      - name: Upload JUnit reports
        if: always() && steps.select.outputs.matrix != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: apps/backend/**/junit.xml
          if-no-files-found: error

      - name: Upload coverage reports
        if: always() && steps.select.outputs.matrix != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: apps/backend/**/coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: always() && steps.select.outputs.matrix != '[]'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: apps/backend
          flags: backend
          fail_ci_if_error: false
          handle_no_reports_found: true

      - name: Write test summary
        if: always() && steps.select.outputs.matrix != '[]'
        env:
          MATRIX_JSON: ${{ steps.select.outputs.matrix }}
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          services = json.loads(os.environ["MATRIX_JSON"])
          lines = [
              "## Backend unit tests",
              "",
              "| Service | Tests | Failures | Errors | Skipped | Statements | Branches |",
              "| --- | --- | --- | --- | --- | --- | --- |",
          ]
          for service in services:
              work = os.path.join("apps", "backend", service)
              junit = os.path.join(work, "junit.xml")
              coverage = os.path.join(work, "coverage.xml")
              if not os.path.isfile(junit):
                  lines.append(f"| `{service}` | not run | | | | | |")
                  continue
              root = ET.parse(junit).getroot()
              suites = [root] if root.tag == "testsuite" else list(root)
              totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "failures", "errors", "skipped")}
              statements = branches = "-"
              if os.path.isfile(coverage):
                  report = ET.parse(coverage).getroot()
                  statements = f"{float(report.get('line-rate', 0)) * 100:.1f}%"
                  branches = f"{float(report.get('branch-rate', 0)) * 100:.1f}%"
              lines.append(
                  f"| `{service}` | {totals['tests']} | {totals['failures']} | {totals['errors']} | {totals['skipped']} | {statements} | {branches} |"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

  backend-unit-tests:
    name: backend-unit-tests
    needs: [unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require unit tests when the backend changed
        run: |
          result="${{ needs.unit-tests.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            exit 1
          fi
