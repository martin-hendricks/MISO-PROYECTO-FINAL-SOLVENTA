[project]
name = "ms-parametrico"
version = "0.1.0"
description = "ApiTelemetria: recibe eventos de proveedores externos, los traduce al evento canónico y los publica en TopicoTelemetria (sin base de datos)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "prometheus-client>=0.21,<1.0",
  "aiokafka>=0.15,<0.16",
  "aws-msk-iam-sasl-signer-python>=1.0,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-socket>=0.7",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: requiere Kafka (MSK_BOOTSTRAP_BROKERS); excluida del workflow unitario",
  "contract: excluida del workflow unitario",
]

[tool.coverage.run]
branch = true
source = ["app"]
