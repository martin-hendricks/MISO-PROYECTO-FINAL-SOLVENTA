# Prometheus real de cluster. Storage: emptyDir a propósito (decisión
# documentada en odd/tasks/observabilidad-prometheus-grafana.md) -- el
# ambiente "minimo" es destructible por diseño (HU-78) y no se justifica un
# EBS persistente todavía. Migrar a PersistentVolumeClaim (gp3, ~10-20Gi) es
# tan simple como cambiar este volumen si se necesita retener histórico
# entre despliegues.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: solventa-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: solventa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: prometheus
      # Fijado al Node Group A (t3.small, 1 nodo): grupo-b ya corre los 12
      # microservicios restantes en 6 nodos t3.small al tope de su maxSize,
      # sin margen real para 3 Deployments más (visto en el cluster: varios
      # rollouts caían en "timed out waiting for the condition" al competir
      # por ese mismo espacio). grupo-a aloja hoy solo ms-cotizacion y
      # ms-perfilamiento (250m/400Mi cada uno); requests recortados aquí para
      # dejar margen real en ese mismo nodo de 2 vCPU/2GB.
      nodeSelector:
        solventa.io/scaling-group: "a"
      tolerations:
        - key: solventa.io/scaling-group
          operator: Equal
          value: "a"
          effect: NoSchedule
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: solventa-observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
