# Ingress del AWS Load Balancer Controller.
#
# Esquema de rutas elegido: por PATH sobre un único ALB compartido, no por
# host. Razón: en el ambiente mínimo no hay dominios/certificados ACM
# definidos todavía (el borde real de nombre de dominio lo resuelve
# CloudFront + API Gateway, módulo `edge` de Terraform, que es quien queda
# expuesto a Internet). Este ALB interno de aplicación solo necesita repartir
# tráfico entre los puntos de entrada que corren en EKS.
#
# IMPORTANTE: el AWS Load Balancer Controller NO reescribe paths (a
# diferencia de nginx-ingress/rewrite-target) -- lo que llega al Ingress se
# pasa tal cual al pod. Por eso cada regla apunta al path REAL que cada
# servicio expone (confirmado contra el cluster con la colección Postman en
# apps/backend/postman/), no a un prefijo artificial por servicio:
#
#   /web                -> bff-web         (portal Angular, vía CloudFront)
#   /movil              -> bff-movil       (app Android)
#   /v1/catalogo        -> api-socios      (único prefijo que su router registra, APIRouter(prefix="/v1"))
#   /v1/productos       -> ms-cotizacion   (APIRouter(prefix="/v1/productos"))
#   /v1/cotizaciones    -> ms-cotizacion   (APIRouter(prefix="/v1/cotizaciones"))
#
# bff-web/bff-movil no tienen Dockerfile ni entran en la matrix de
# deploy.yml todavía -- las reglas quedan declaradas desde ya (el AWS Load
# Balancer Controller no falla por apuntar a un Service que aún no existe:
# el target group queda vacío/unhealthy hasta que el Service aparezca) para
# no tener que volver a tocar este archivo cuando se desplieguen.
#
# Los Ingress comparten un solo ALB gracias a
# `alb.ingress.kubernetes.io/group.name`: el controlador crea un único
# Application Load Balancer y un Listener por grupo, en vez de un ALB por
# Ingress (ahorro de costo y de configuración DNS).
#
# target-type "ip" porque los pods usan VPC CNI (IP de pod enrutable
# directamente), evitando el salto extra por NodePort.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solventa-ingress
  namespace: solventa
  labels:
    app.kubernetes.io/part-of: solventa
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: solventa-front
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # TODO: una vez exista certificado ACM para el dominio definitivo, agregar
    # alb.ingress.kubernetes.io/certificate-arn y
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    # /health, no /health/ready: todos los servicios desplegados hoy
    # (api-socios, ms-cotizacion) exponen un único endpoint /health sin
    # distinguir liveness de readiness (ver apps/backend/*/app/observabilidad.py).
    # /health/ready devuelve 404 en los tres, lo que marcaría cada target
    # como unhealthy de forma permanente.
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  rules:
    - http:
        paths:
          - path: /web
            pathType: Prefix
            backend:
              service:
                name: bff-web
                port:
                  number: 8080
          - path: /movil
            pathType: Prefix
            backend:
              service:
                name: bff-movil
                port:
                  number: 8080
          - path: /v1/catalogo
            pathType: Prefix
            backend:
              service:
                name: api-socios
                port:
                  number: 8080
          - path: /v1/productos
            pathType: Prefix
            backend:
              service:
                name: ms-cotizacion
                port:
                  number: 8000
          - path: /v1/cotizaciones
            pathType: Prefix
            backend:
              service:
                name: ms-cotizacion
                port:
                  number: 8000
