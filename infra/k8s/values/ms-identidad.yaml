# ms-identidad — alta de cuenta y validación de credenciales (SOLV-215)
#
# No emite ni valida JWT: bff-web sigue siendo el único emisor/validador de
# tokens de sesión (app/dependencies.py, issue_pair/_decode) -- ver PR #107.
# ms-identidad solo confirma identidad (hash de contraseña + lookup por
# email/documento) en dos momentos puntuales: registro y login. Por eso no
# está en la ruta caliente de cada request del canal web (a diferencia de lo
# que el placeholder original de este archivo asumía, con JWT_ISSUER propio y
# el sizing de un IDP crítico) y su sizing es comparable al resto de servicios
# de Grupo B, no al de un componente transversal.
#
# No tiene instancia RDS propia: su esquema (ms_identidad) vive en
# DBCompartida desde el plan original (infra/terraform/PLAN.md, lista de los
# 10 esquemas fijada 2026-10-01) -- igual que ms-cotizacion/ms-suscripcion.

nombre: ms-identidad

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-ms-identidad"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 2
grupoEscalado: "b"

puerto: 8080
puertoMetricas: 9090

recursos:
  requests:
    cpu: "300m"
    memory: "512Mi"
  limits:
    cpu: "800m"
    memory: "1Gi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 5
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 2
  maxReplicas: 8
  targetCPU: 65
  targetMemory: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    - nombreRemoto: solventa-minimo-compartida-db-credentials
      nombreLocal: ms-identidad-db
      claves:
        - database_url

serviceAccount:
  crear: true
  nombre: ms-identidad
  roleArn: ""

podDisruptionBudget:
  habilitado: true
  minAvailable: 1

topologySpread:
  habilitado: true
  maxSkew: 1

variablesEntornoSecreto:
  - nombre: DATABASE_URL
    nombreSecreto: ms-identidad-db
    claveSecreto: database_url
