name: Backend CI

on:
  pull_request:
    branches: [develop, main, "release/**"]
    paths: ["apps/backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [develop, main, "feature/**", "release/**", "hotfix/**", "bugfix/**"]
    paths: ["apps/backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  descubrir:
    runs-on: ubuntu-latest
    outputs:
      proyectos: ${{ steps.buscar.outputs.proyectos }}
      con_bd: ${{ steps.buscar.outputs.con_bd }}
    steps:
      - uses: actions/checkout@v4
      - id: buscar
        working-directory: apps/backend
        run: |
          proyectos=$(find . -mindepth 2 -maxdepth 3 -name pyproject.toml -not -path '*/.venv/*' \
            -exec dirname {} \; | sed 's|^\./||' | sort | jq -R . | jq -sc .)
          con_bd=$(ls -d ms-*/db 2>/dev/null | xargs -r -n1 dirname | sort | jq -R . | jq -sc .)
          echo "proyectos=$proyectos" >> "$GITHUB_OUTPUT"
          echo "con_bd=$con_bd" >> "$GITHUB_OUTPUT"
          echo "Proyectos: $proyectos"; echo "Con BD: $con_bd"

  unitarias:
    needs: descubrir
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: ${{ fromJson(needs.descubrir.outputs.proyectos) }}
    defaults:
      run:
        working-directory: apps/backend/${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: PyTest (sin red ni BD)
        run: >
          python -m pytest tests -m "not integration and not contract"
          --cov --cov-report=xml --cov-report=term --junitxml=junit.xml
      - name: Nombre del artefacto
        id: artefacto
        if: always()
        env:
          PROYECTO: ${{ matrix.proyecto }}
        run: echo "nombre=reportes-${PROYECTO//\//-}" >> "$GITHUB_OUTPUT"
      - name: Publicar cobertura y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artefacto.outputs.nombre }}
          path: |
            apps/backend/${{ matrix.proyecto }}/coverage.xml
            apps/backend/${{ matrix.proyecto }}/junit.xml
          if-no-files-found: warn

  integracion:
    needs: descubrir
    if: needs.descubrir.outputs.con_bd != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: ${{ fromJson(needs.descubrir.outputs.con_bd) }}
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_DB: solventa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d solventa"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/backend/${{ matrix.proyecto }}
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/solventa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar DDL del servicio
        env:
          PGPASSWORD: postgres
        run: for f in db/*.sql; do psql -h localhost -U postgres -d solventa -v ON_ERROR_STOP=1 -f "$f"; done
      - run: pip install -e ".[test]"
      - run: python -m pytest tests -m integration
