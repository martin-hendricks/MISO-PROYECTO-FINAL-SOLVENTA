# ms-siniestros — reclamaciones (Grupo B)
#
# A diferencia de ms-polizas, aquí NO hay endpoint de lectura separado: la
# réplica de DBSiniestros es un standby PASIVO (EC-DISP-06/07), no sirve
# tráfico. Escribe evidencia de siniestros a S3, por eso necesita IRSA
# (serviceAccount.roleArn) para asumir un rol con permisos de escritura sobre
# el bucket de evidencias.

nombre: ms-siniestros

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-ms-siniestros"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 1
grupoEscalado: "b"

puerto: 8080
puertoMetricas: 8080

recursos:
  # Bajado de 512Mi/1Gi: con la cuota real de vCPU de la cuenta (16, ver
  # terraform.tfvars del ambiente minimo), el Node Group B solo puede sostener
  # 5 nodos t3.small -- los 7 servicios de este grupo en reposo con 512Mi
  # cada uno dejaban ~95% de memoria reservada sin margen para un rolling
  # update (confirmado: FailedScheduling "Insufficient memory" en todos los
  # nodos durante un deploy). 300Mi deja margen real; subir junto con
  # node_group_b_instance_types si hace falta representar carga real.
  requests:
    cpu: "300m"
    memory: "300Mi"
  limits:
    cpu: "800m"
    memory: "600Mi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 5
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 1
  maxReplicas: 6
  targetCPU: 65
  targetMemory: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    # Solo se proyecta database_url (no username/password/host/port por
    # separado): la app (apps/backend/ms-siniestros/app/config.py) espera
    # una única variable DATABASE_URL, igual que ms-cotizacion/ms-perfilamiento
    # con DBCompartida.
    - nombreRemoto: solventa-minimo-siniestros-db-credentials
      nombreLocal: ms-siniestros-db
      claves:
        - database_url
    - nombreRemoto: solventa-minimo-bff-web-token
      nombreLocal: ms-siniestros-token
    # S3_EVIDENCIAS_BUCKET: lo publica Terraform (modules/secrets,
    # siniestros_config) porque el nombre del bucket lleva sufijo aleatorio.
    - nombreRemoto: solventa-minimo-siniestros-config
      nombreLocal: ms-siniestros-config

serviceAccount:
  crear: true
  nombre: ms-siniestros
  # El workflow de CD arma el ARN por convención
  # (arn:aws:iam::<cuenta>:role/solventa-minimo-ms-siniestros-irsa, ver
  # modules/irsa_aplicacion) cuando irsa es true. Para un helm manual:
  # terraform output -json irsa_role_arns | jq -r '."ms-siniestros"'
  irsa: true
  roleArn: ""

podDisruptionBudget:
  habilitado: true
  minAvailable: 1

topologySpread:
  habilitado: true
  maxSkew: 1

variablesEntorno:
  # S3_EVIDENCIAS_BUCKET llega de externalSecrets (ms-siniestros-config).
  # HU-157: región del bucket. Sin S3_ENDPOINT_URL ni llaves: en EKS boto3 usa IRSA. El
  # bucket ya cifra por defecto con la CMK del módulo kms (sin SSE explícito por objeto).
  - nombre: AWS_REGION
    valor: "us-east-1"

variablesEntornoSecreto:
  - nombre: DATABASE_URL
    nombreSecreto: ms-siniestros-db
    claveSecreto: database_url
