# analitica — consumidor de BusEventos (Grupo A)
#
# Carga batch/streaming para reportería y modelos, no está en el camino
# crítico de latencia de ningún caso de uso síncrono. Consume BusEventos de
# MSK, por lo que necesita IRSA. Recursos modestos y HPA con techo bajo: el
# consumo de Kafka se nivela con el número de particiones, no tiene sentido
# escalar agresivamente por CPU.
#
# Movido de Grupo B a Grupo A (2026-11-12, ver terraform.tfvars): Grupo B
# (5 nodos t3.small tras este movimiento) no tenía margen para que el
# RollingUpdate de varios servicios concurrentes completara sin timeout.
# analitica es el candidato más seguro para mover -- asíncrono, sin impacto
# en ningún flujo síncrono de negocio si se demora un rollout.

nombre: analitica

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-analitica"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 2
grupoEscalado: "a"

puerto: 8080
puertoMetricas: 9090

recursos:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 20
    periodSeconds: 15
  readiness:
    path: /health/ready
    initialDelaySeconds: 15
    periodSeconds: 10
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 75
  targetMemory: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

# SOLVENTA_TOKEN_SECRET valida el Bearer de /v1/metricas (rol operador) --
# mismo secreto compartido por todo el ecosistema (bff-web, notificaciones,
# ms-polizas, etc.). Sin esto, cualquier llamada autenticada responde 500
# "SOLVENTA_TOKEN_SECRET no configurado" (mismo patrón ya visto y corregido
# en notificaciones.yaml).
#
# analitica-db: analitica tiene su propio esquema (db/01_analitica.sql,
# CREATE SCHEMA analitica) pero, igual que ms-perfilamiento/ms-cotizacion, sin
# instancia RDS propia -- vive en DBCompartida. El workflow de CD detecta
# automáticamente el paso de migraciones por la carpeta db/ existente y
# espera un ExternalSecret llamado exactamente "<servicio>-db"
# (.github/workflows/deploy.yml); sin esta entrada faltaba por completo.
externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    - nombreRemoto: solventa-minimo-bff-web-token
      nombreLocal: analitica-token
    - nombreRemoto: solventa-minimo-compartida-db-credentials
      nombreLocal: analitica-db
      claves:
        - database_url

serviceAccount:
  crear: true
  nombre: analitica
  roleArn: ""  # Rellenar con: terraform output -json irsa_role_arns | jq -r '."analitica"'

podDisruptionBudget:
  habilitado: false

topologySpread:
  habilitado: false
  maxSkew: 1

variablesEntorno:
  - nombre: MSK_BOOTSTRAP_BROKERS
    valor: ""  # TODO: reemplazar por msk.bootstrap_brokers_sasl_iam (output de Terraform)
  - nombre: MSK_TOPIC
    valor: "BusEventos"
  - nombre: MSK_AUTH_MECHANISM
    valor: "AWS_MSK_IAM"
  - nombre: MSK_CONSUMER_GROUP
    valor: "analitica-cg"

variablesEntornoSecreto:
  - nombre: DATABASE_URL
    nombreSecreto: analitica-db
    claveSecreto: database_url
