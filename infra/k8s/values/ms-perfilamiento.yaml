# ms-perfilamiento — MotorRiesgo (Grupo A, cómputo intensivo)
#
# Motor de riesgo con fan-out paralelo a Open Finance y Open Data (dos llamadas
# externas concurrentes por evaluación). Objetivo EC-LAT-03/04: p95 <= 400 ms,
# p99 <= 800 ms. Comparte Node Group A (c6i.xlarge, taint dedicado) con
# ms-cotizacion pero con curva de carga independiente, por eso su HPA es algo
# menos agresivo que el de cotización. Consume los secretos de open_finance y
# open_data, y DATABASE_URL de DBCompartida (no tiene instancia RDS propia,
# igual que ms-cotizacion -- ver module.rds_compartida en el environment
# "minimo").

nombre: ms-perfilamiento

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-ms-perfilamiento"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

# Diseño original: 3. 1 para el ambiente mínimo/demo, donde el Node Group A
# corre en t3.small (2 vCPU/2GB, free-tier-eligible) -- no cabrían 3 réplicas
# de 2Gi cada una en un solo nodo así de chico. Ver también hpa.minReplicas
# y recursos.requests más abajo, y node_group_a_instance_types en
# infra/terraform/environments/minimo/variables.tf.
replicas: 1
grupoEscalado: "a"

puerto: 8080
puertoMetricas: 9090

# Diseño original: 1000m/2Gi requests, 2000m/3Gi limits (c6i.xlarge, 4
# vCPU/8GB). t3.small del ambiente mínimo/demo solo tiene 2 vCPU/2GB TOTALES
# por nodo, con overhead de kubelet/CNI/sistema -- un pod de 2Gi no cabría
# (confirmado en el cluster: FailedScheduling por "Insufficient memory" y
# "max node group size reached" simultáneos). Bajado a algo que deje margen
# real en un nodo de 2GB, igual que ms-cotizacion; subir junto con
# node_group_a_instance_types si hace falta representar carga real.
recursos:
  requests:
    cpu: "250m"
    memory: "400Mi"
  limits:
    cpu: "500m"
    memory: "700Mi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 5
  startup:
    habilitado: true
    path: /health/live
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 12

hpa:
  habilitado: true
  # Diseño original: 3, acorde al fan-out de EC-LAT-03/04. 1 para el
  # ambiente mínimo/demo, acorde a replicas: 1 más arriba.
  minReplicas: 1
  maxReplicas: 12
  targetCPU: 60
  targetMemory: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 75
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    - nombreRemoto: solventa-minimo-open_finance-credentials
      nombreLocal: ms-perfilamiento-open-finance
      claves:
        - clientId
        - clientSecret
    - nombreRemoto: solventa-minimo-open_data-credentials
      nombreLocal: ms-perfilamiento-open-data
      claves:
        - clientId
        - clientSecret
    - nombreRemoto: solventa-minimo-compartida-db-credentials
      nombreLocal: ms-perfilamiento-db
      claves:
        - database_url

serviceAccount:
  crear: true
  nombre: ms-perfilamiento
  roleArn: ""  # No requiere IRSA: consume Redis (CacheOD) y secretos vía External Secrets

# Deshabilitado con replicas: 1: un PDB con minAvailable >= 1 bloquearía
# CUALQUIER operación de drenado (rollout, actualización de nodo), porque
# nunca se podría satisfacer con una sola réplica total -- y no hay
# redundancia real que proteger de todas formas. Diseño original: habilitado
# con minAvailable: 2, acorde a replicas: 3; reactivar junto con eso.
podDisruptionBudget:
  habilitado: false
  minAvailable: 2

topologySpread:
  habilitado: true
  maxSkew: 1

variablesEntorno:
  - nombre: REDIS_CACHE_OD_HOST
    valor: "cache-od.solventa.internal"  # TODO: reemplazar por el output real de elasticache al integrar
  - nombre: REDIS_CACHE_OD_TTL_SECONDS
    valor: "600"
  - nombre: NODE_GROUP
    valor: "a"
  - nombre: FANOUT_TIMEOUT_MS
    valor: "300"

variablesEntornoSecreto:
  - nombre: DATABASE_URL
    nombreSecreto: ms-perfilamiento-db
    claveSecreto: database_url
