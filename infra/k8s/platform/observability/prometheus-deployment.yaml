# Prometheus real de cluster. Storage: emptyDir a propósito (decisión
# documentada en odd/tasks/observabilidad-prometheus-grafana.md) -- el
# ambiente "minimo" es destructible por diseño (HU-78) y no se justifica un
# EBS persistente todavía. Migrar a PersistentVolumeClaim (gp3, ~10-20Gi) es
# tan simple como cambiar este volumen si se necesita retener histórico
# entre despliegues.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: solventa-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: solventa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: solventa-observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
