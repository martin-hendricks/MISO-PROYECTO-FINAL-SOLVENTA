# notificaciones — push/email (Grupo B)
#
# Consumidor de BusEventos de MSK para disparar notificaciones al cliente
# final (emisión de póliza, siniestro actualizado, pago procesado). Igual que
# analitica, necesita IRSA para MSK. Es asíncrono y tolera algo de rezago, así
# que recursos y HPA son modestos, aunque algo más altos que analitica porque
# su cola no debe crecer sin control (impacto directo en experiencia de
# usuario si las notificaciones se demoran).

nombre: notificaciones

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-notificaciones"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 1
grupoEscalado: "b"

puerto: 8080
puertoMetricas: 8080

recursos:
  requests:
    cpu: "250m"
    memory: "384Mi"
  limits:
    cpu: "600m"
    memory: "768Mi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 15
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 10
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 1
  maxReplicas: 6
  targetCPU: 70
  targetMemory: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

# SOLVENTA_TOKEN_SECRET: notificaciones valida el Bearer que bff-movil
# reenvía (app/seguridad.py, exigir_llamante) con el mismo secreto que ya
# usan bff-web/bff-movil/ms-polizas/etc. (solventa-minimo-bff-web-token,
# tras el cambio en infra/k8s/values/bff-movil.yaml que unificó los
# secretos) -- sin esto, POST /v1/notificaciones/dispositivos responde 500
# "SOLVENTA_TOKEN_SECRET no configurado" para cualquier llamada autenticada.
externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    - nombreRemoto: solventa-minimo-bff-web-token
      nombreLocal: notificaciones-token
      # Sin `claves`: se usa dataFrom.extract (ver mismo comentario en
      # infra/k8s/values/bff-web.yaml).
    - nombreRemoto: solventa-minimo-notificaciones-fcm
      nombreLocal: notificaciones-fcm
    - nombreRemoto: solventa-minimo-msk-config
      nombreLocal: notificaciones-msk
    # notificaciones-db: notificaciones tiene su propio esquema
    # (db/01_notificaciones.sql, CREATE SCHEMA notificaciones) pero, igual
    # que analitica/ms-perfilamiento, sin instancia RDS propia -- vive en
    # DBCompartida. El workflow de CD detecta automáticamente el paso de
    # migraciones por la carpeta db/ existente y espera un ExternalSecret
    # llamado exactamente "<servicio>-db" (.github/workflows/deploy.yml);
    # sin esta entrada faltaba por completo (mismo gap encontrado y
    # corregido en analitica.yaml).
    - nombreRemoto: solventa-minimo-compartida-db-credentials
      nombreLocal: notificaciones-db
      claves:
        - database_url

serviceAccount:
  crear: true
  nombre: notificaciones
  irsa: true
  roleArn: ""

podDisruptionBudget:
  habilitado: true
  minAvailable: 1

topologySpread:
  habilitado: false
  maxSkew: 1

variablesEntorno:
  - nombre: MSK_TOPIC
    valor: "BusEventos"
  - nombre: MSK_AUTH_MECHANISM
    valor: "AWS_MSK_IAM"
  - nombre: MSK_CONSUMER_GROUP
    valor: "notificaciones"
  - nombre: PUSH_PROVEEDOR
    valor: "fcm"

variablesEntornoSecreto:
  - nombre: DATABASE_URL
    nombreSecreto: notificaciones-db
    claveSecreto: database_url
