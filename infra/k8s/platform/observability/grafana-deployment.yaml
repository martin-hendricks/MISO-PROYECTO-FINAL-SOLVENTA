# Grafana real de cluster. Login anónimo desactivado a propósito (a
# diferencia de experiments/ha-01/ha-08, que lo activaban para uso local
# puro vía Docker Compose): Grafana queda expuesto al exterior a través del
# ALB/API Gateway real (ver target-group-bindings.yaml de esta carpeta),
# así que necesita autenticación real.
#
# Provisioning automático de datasource + dashboards (ver
# grafana-provisioning-datasources.yaml y el ConfigMap "grafana-dashboards"
# que el pipeline de CD genera con `kubectl create configmap --from-file`
# desde infra/k8s/platform/observability/dashboards/*.json, igual que
# <servicio>-migrations en .github/workflows/deploy.yml) -- sin esto, el
# datasource había que crearlo a mano desde la UI, que es justo la brecha
# que experiments/ha-08/observability/grafana/provisioning/README.md deja
# documentada como pendiente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: solventa-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: solventa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Fijado al Node Group A, mismo motivo que prometheus-deployment.yaml:
      # grupo-b ya está al tope de su maxSize sin margen para pods nuevos.
      nodeSelector:
        solventa.io/scaling-group: "a"
      tolerations:
        - key: solventa.io/scaling-group
          operator: Equal
          value: "a"
          effect: NoSchedule
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: GF_SECURITY_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/observabilidad/grafana"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-provisioning-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: solventa-observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
