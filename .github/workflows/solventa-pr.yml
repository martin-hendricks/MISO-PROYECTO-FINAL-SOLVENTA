name: Solventa

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
    types: [opened, synchronize, reopened]

jobs:
  changes:
    name: detect-solventa-changes
    runs-on: ubuntu-latest
    outputs:
      solventa: ${{ steps.filter.outputs.solventa }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            solventa:
              - 'apps/mobile/Solventa/**'
              - '.github/workflows/solventa-pr.yml'

  unit-tests:
    name: unit-tests
    needs: changes
    if: needs.changes.outputs.solventa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            apps/mobile/Solventa/**/*.gradle*
            apps/mobile/Solventa/**/*.gradle.kts
            apps/mobile/Solventa/gradle/libs.versions.toml
            apps/mobile/Solventa/gradle/wrapper/gradle-wrapper.properties
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' 84831b9409646161da1ba361b4be9f04 > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - name: Run unit tests
        working-directory: apps/mobile/Solventa
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: apps/mobile/Solventa/app/build/reports/tests/testDebugUnitTest/

  e2e:
    name: android-e2e
    needs: [changes, unit-tests]
    if: needs.changes.outputs.solventa == 'true' && needs.unit-tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            apps/mobile/Solventa/**/*.gradle*
            apps/mobile/Solventa/**/*.gradle.kts
            apps/mobile/Solventa/gradle/libs.versions.toml
            apps/mobile/Solventa/gradle/wrapper/gradle-wrapper.properties
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' 84831b9409646161da1ba361b4be9f04 > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/mobile/Solventa
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-report
          path: apps/mobile/Solventa/app/build/reports/androidTests/connected/

  solventa-unit-tests:
    name: solventa-unit-tests
    needs: [changes, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require unit tests when Solventa changed
        run: |
          result="${{ needs.unit-tests.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            exit 1
          fi

  solventa-e2e:
    name: solventa-e2e
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require E2E when Solventa changed
        run: |
          result="${{ needs.e2e.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            exit 1
          fi
