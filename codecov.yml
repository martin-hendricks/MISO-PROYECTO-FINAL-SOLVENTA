coverage:
  status:
    # Cobertura mínima exigida: 80 %. Por debajo de ese valor el check falla.
    project:
      default:
        target: 80%
      backend:
        flags:
          - backend
        target: 80%
      web:
        flags:
          - web
        target: 80%
      mobile:
        flags:
          - mobile
        target: 80%
    # El código nuevo o modificado en el PR también debe tener al menos 80 %.
    patch:
      default:
        target: 80%

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: backend
      paths:
        - apps/backend/.*
      carryforward: true
    - name: web
      paths:
        - apps/web/.*
      carryforward: true
    - name: mobile
      paths:
        - apps/mobile/.*
      carryforward: true

# Compose screens and MainActivity run on device. Connected tests cover them;
# the unit-test JaCoCo report excludes the same files.
ignore:
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/MainActivity.kt"
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/ui/shell/CustomerShell.kt"
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/ui/shell/SplashScreen.kt"
