# Plantilla del Job de migraciones SQL, una ejecución por servicio con
# carpeta apps/backend/<servicio>/db/. No es parte del chart de Helm
# (infra/k8s/charts/microservicio/) a propósito: solo aplica a 2 de los 14
# componentes hoy (ms-arquetipo, ms-cotizacion), y el chart genérico se
# mantiene igual para los 14 sin ramas condicionales por caso particular.
#
# deploy.yml renderiza $SERVICIO y $DB_SECRET_NAME con envsubst antes de
# aplicar este archivo. El ConfigMap <servicio>-migrations (con los .sql y
# run-migrations.sh) se crea aparte, justo antes de este Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${SERVICIO}-migrate
  namespace: solventa
  labels:
    app.kubernetes.io/name: ${SERVICIO}
    app.kubernetes.io/component: migrations
spec:
  # ttlSecondsAfterFinished no se fija: el historial de Jobs de migración
  # queda visible (kubectl get jobs -n solventa) para auditar qué corrió y
  # cuándo, igual que schema_migrations lo hace a nivel de BD.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${SERVICIO}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh", "/migrations/run-migrations.sh"]
          envFrom:
            - secretRef:
                name: ${DB_SECRET_NAME}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: ${SERVICIO}-migrations
            defaultMode: 0755
