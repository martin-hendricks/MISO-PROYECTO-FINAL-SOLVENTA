[project]
name = "ms-cotizacion"
version = "0.1.0"
description = "Cotización de Solventa: catálogo de productos y motor de rating (hexagonal + SQLAlchemy async)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "asyncpg>=0.30,<1.0",
  "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27,<1.0",
]

contract = [
  "pact-python>=2.2,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: requiere PostgreSQL (DATABASE_URL); excluida del workflow unitario",
  "contract: excluida del workflow unitario",
]

[tool.coverage.run]
branch = true
source = ["app"]
