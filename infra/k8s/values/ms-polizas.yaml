# ms-polizas — ciclo de vida de pólizas (Grupo B)
#
# Redundancia ACTIVA (EC-LAT-10: p95 <= 150 ms de lectura): las consultas de
# lectura se separan explícitamente hacia el reader endpoint de la réplica de
# RDS, mientras las escrituras van al writer. Por eso este servicio define DOS
# variables de conexión a BD en lugar de una. Volumen de tráfico alto porque lo
# consultan suscripción, siniestros y los BFFs.

nombre: ms-polizas

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-ms-polizas"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 3
grupoEscalado: "b"

puerto: 8080
puertoMetricas: 9090

recursos:
  requests:
    cpu: "400m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 5
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 3
  maxReplicas: 10
  targetCPU: 65
  targetMemory: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 75
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    - nombreRemoto: solventa-minimo-polizas-db-credentials
      nombreLocal: ms-polizas-db
      claves:
        - username
        - password
        - host
        - port
        - dbname

serviceAccount:
  crear: true
  nombre: ms-polizas
  roleArn: ""

podDisruptionBudget:
  habilitado: true
  minAvailable: 2

topologySpread:
  habilitado: true
  maxSkew: 1

variablesEntorno:
  # Escritura: apunta al writer endpoint de DBPolizas.
  - nombre: DB_POLIZAS_WRITE_HOST
    valor: "polizas-writer.solventa.internal"  # TODO: reemplazar por rds_polizas.writer_endpoint (output de Terraform)
  # Lectura: apunta a la réplica ACTIVA (EC-LAT-10, RPO <= 30 s). Todo GET debe usar esta variable.
  - nombre: DB_POLIZAS_READ_HOST
    valor: "polizas-reader.solventa.internal"  # TODO: reemplazar por rds_polizas.reader_endpoint (output de Terraform)
