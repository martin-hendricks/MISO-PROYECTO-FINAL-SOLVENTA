# api-socios — API embebida para los 30+ socios de distribución (Grupo B)
#
# Recibe tráfico del API Gateway vía ALB. Tráfico de terceros (agencias,
# comparadores, corredores): más variable e impredecible que el de los BFFs
# propios, por eso su HPA tiene un rango amplio y un scaleUp más reactivo,
# similar al de los BFFs pero con más margen de techo por picos de socios
# grandes.

nombre: api-socios

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-api-socios"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 3
grupoEscalado: "b"

puerto: 8080
puertoMetricas: 9090

recursos:
  requests:
    cpu: "300m"
    memory: "384Mi"
  limits:
    cpu: "800m"
    memory: "768Mi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 3
  maxReplicas: 16
  targetCPU: 60
  targetMemory: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 20
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

externalSecrets:
  habilitado: false

serviceAccount:
  crear: true
  nombre: api-socios
  roleArn: ""

podDisruptionBudget:
  habilitado: true
  minAvailable: 2

topologySpread:
  habilitado: true
  maxSkew: 1

variablesEntorno:
  - nombre: MS_IDENTIDAD_URL
    valor: "http://ms-identidad.solventa.svc.cluster.local"
  - nombre: MS_COTIZACION_URL
    valor: "http://ms-cotizacion.solventa.svc.cluster.local"
  - nombre: RATE_LIMIT_POR_SOCIO_RPM
    valor: "600"
