{{- if .Values.externalSecrets.habilitado }}
{{- range .Values.externalSecrets.remoteSecrets }}
{{- $secreto := . }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .nombreLocal }}
  labels:
    {{- include "microservicio.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .nombreLocal }}
    creationPolicy: Owner
  {{- if .claves }}
  # Se pidieron claves puntuales: se proyecta solo esa lista de claves del
  # secreto remoto (ej. cuando solo se necesita "password" y no todo el
  # JSON de credenciales).
  data:
    {{- range .claves }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $secreto.nombreRemoto }}
        property: {{ . }}
    {{- end }}
  {{- else }}
  # Sin `claves` explícitas: se usa `dataFrom.extract`, que proyecta TODO
  # el JSON del secreto remoto como pares clave/valor del Secret local. Los
  # secretos de credenciales de BD (solventa-minimo-<db>-db-credentials)
  # traen un único JSON con username/password/host/port/dbname, así que
  # `extract` evita tener que enumerar cada clave a mano.
  dataFrom:
    - extract:
        key: {{ .nombreRemoto }}
  {{- end }}
{{- end }}
{{- end }}
