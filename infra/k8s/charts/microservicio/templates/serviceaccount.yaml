{{- if .Values.serviceAccount.crear }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservicio.serviceAccountName" . }}
  labels:
    {{- include "microservicio.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA: permite que los pods de este ServiceAccount asuman el rol de
    # IAM indicado (ej. para leer secretos de Secrets Manager o escribir en
    # el bucket S3 de evidencias de siniestros) sin credenciales estáticas.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
{{- end }}
