# kube-state-metrics: métricas de estado de objetos de Kubernetes (pods,
# deployments, nodos) -- ninguno de los experimentos (ha-01/ha-08) las tenía,
# porque Docker Compose no tiene objetos de K8s que describir. Complementa
# las métricas de proceso que cada pod ya expone (process_cpu_seconds_total,
# process_resident_memory_bytes vía prometheus_client) con el estado real del
# cluster: pods en CrashLoopBackOff, restarts, requests/limits vs. réplicas
# deseadas, etc. RBAC read-only, imagen oficial del proyecto upstream, sin
# storage propio -- costo marginal de cómputo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: solventa-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: solventa-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints", "namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: solventa-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: solventa-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: solventa-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: solventa-observability
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: solventa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: solventa-observability
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
