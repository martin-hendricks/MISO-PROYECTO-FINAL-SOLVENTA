services:
  web:
    build: .
    ports:
      - "8080:80"
    # El proxy /web/ -> bff-web es solo de desarrollo local: la imagen lleva
    # nginx.conf (solo SPA, como producción) y aquí se sobreescribe con
    # nginx.local.conf. bff-web corre en el otro proyecto de compose
    # (apps/backend) publicado en el puerto 8000 del host. Docker Desktop ya
    # define host.docker.internal; en Linux hace falta este mapeo explícito.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
