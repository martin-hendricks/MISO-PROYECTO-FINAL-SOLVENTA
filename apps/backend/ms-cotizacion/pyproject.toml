[project]
name = "ms-cotizacion"
version = "0.1.0"
description = "Núcleo de cotización de Solventa: recibe la solicitud, valida contra el catálogo y devuelve la oferta"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: excluida del workflow unitario",
  "contract: verificación Pact (HU-88); excluida del workflow unitario",
]

[tool.coverage.run]
branch = true
source = ["app"]
