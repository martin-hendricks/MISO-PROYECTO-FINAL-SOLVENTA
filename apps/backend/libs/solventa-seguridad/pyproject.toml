[project]
name = "solventa-seguridad"
version = "0.1.0"
description = "Validador JWT (RS256) y autorización por rol compartidos por los BFF de Solventa (HU-74, HU-75, HU-76)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solventa_seguridad"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["solventa_seguridad"]
