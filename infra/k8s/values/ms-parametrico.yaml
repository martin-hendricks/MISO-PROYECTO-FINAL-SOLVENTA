# ms-parametrico — :ApiTelemetria (Grupo B)
#
# Ingesta de eventos de telemetría (vuelos, clima). Traduce la carga de cada
# proveedor al evento canónico (:AdaptadorTelemetria) y la PUBLICA en
# TopicoTelemetria de MSK con acks=all. No tiene base de datos ni evalúa: el
# consumidor es ms-siniestros (decisión D5, opción B). Responde 202 cuando el
# tópico confirmó la escritura, y 429/503 con Retry-After como contrapresión
# (EC-ESC-03: 1.000.000 de eventos en 10 min).
#
# Es el dueño del tópico: su rol IRSA lleva CreateTopic sobre
# TopicoTelemetria y deploy.yml lo crea una sola vez con el Job
# platform/crear-topico-telemetria.yaml. También consume el secreto de
# telemetria_iot (clientId/clientSecret del proveedor).
#
# Queda solo dentro del clúster: exponerlo por ALB + API Gateway (ruta
# dedicada para proveedores) es trabajo pendiente del borde.

nombre: ms-parametrico

# deploy.yml resuelve el bootstrap broker SASL/IAM y lo inyecta en la entrada
# MSK_BOOTSTRAP_BROKERS de variablesEntorno.
kafka:
  necesitaMsk: true

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-ms-parametrico"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 1
grupoEscalado: "b"

puerto: 8080
puertoMetricas: 8080

# Ingesta delgada: sin BD, cada petición valida, traduce y espera el ack del
# broker. Escala por CPU; el rezago lo guarda el tópico, no la memoria del pod.
recursos:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 20
    periodSeconds: 10
  readiness:
    # 503 mientras el productor de Kafka no arrancó.
    path: /health/ready
    initialDelaySeconds: 15
    periodSeconds: 5
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 1
  maxReplicas: 12
  targetCPU: 70
  targetMemory: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    - nombreRemoto: solventa-minimo-telemetria_iot-credentials
      nombreLocal: ms-parametrico-telemetria-iot
      claves:
        - clientId
        - clientSecret

serviceAccount:
  crear: true
  nombre: ms-parametrico
  # deploy.yml arma el ARN por convención (solventa-minimo-ms-parametrico-irsa)
  # cuando irsa es true. Para un helm manual:
  # terraform output -json irsa_role_arns | jq -r '."ms-parametrico"'
  irsa: true
  roleArn: ""

podDisruptionBudget:
  habilitado: true
  minAvailable: 1

topologySpread:
  habilitado: true
  maxSkew: 1

variablesEntorno:
  - nombre: MSK_BOOTSTRAP_BROKERS
    valor: ""  # lo inyecta deploy.yml (kafka.necesitaMsk)
  - nombre: MSK_TOPIC
    valor: "TopicoTelemetria"
  - nombre: MSK_AUTH_MECHANISM
    valor: "AWS_MSK_IAM"
  - nombre: AWS_REGION
    valor: "us-east-1"
  - nombre: MAX_PUBLICACIONES_EN_VUELO
    valor: "500"
