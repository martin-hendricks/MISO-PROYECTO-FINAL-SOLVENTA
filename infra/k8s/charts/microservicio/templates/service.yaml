apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservicio.fullname" . }}
  labels:
    {{- include "microservicio.labels" . | nindent 4 }}
  {{- if .Values.prometheus.scrape }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: {{ .Values.prometheus.path | quote }}
    prometheus.io/port: {{ .Values.puertoMetricas | quote }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "microservicio.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.puerto }}
      targetPort: http
      protocol: TCP
    {{- if ne (.Values.puertoMetricas | toString) (.Values.puerto | toString) }}
    # Mismo motivo que deployment.yaml: solo existe un containerPort
    # "metrics" separado cuando puertoMetricas difiere de puerto. Si son
    # iguales (el caso real hoy, en los 14 microservicios), el puerto
    # "http" ya sirve /metrics -- declarar aquí un segundo "metrics" con el
    # mismo número produce "duplicate entries for key [port=...]" en el
    # Server-Side Apply de Helm.
    - name: metrics
      port: {{ .Values.puertoMetricas }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
