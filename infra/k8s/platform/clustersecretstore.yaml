# ClusterSecretStore de External Secrets Operator (ESO) hacia AWS Secrets
# Manager.
#
# Es el recurso que hace posible que cada ExternalSecret declarado en los
# values de cada componente (ver infra/k8s/values/*.yaml, bloque
# `externalSecrets`) resuelva sus `remoteSecrets` contra los secretos reales
# creados por el módulo Terraform `secrets` (nombres como
# `solventa-minimo-polizas-db-credentials`).
#
# Autenticación: el pod de external-secrets corre con el ServiceAccount
# `external-secrets` en el namespace `external-secrets`, que Terraform anota
# con el rol IRSA `${project_name}-${environment}-external-secrets-irsa`
# (módulo eks_addons). Por eso aquí NO se referencian credenciales estáticas:
# el tipo de auth es `jwt` vía el propio ServiceAccount de Kubernetes, que AWS
# STS cambia por credenciales temporales a través del proveedor OIDC del
# clúster.
#
# Es un recurso de alcance de CLÚSTER (no de namespace), por eso cualquier
# ExternalSecret en cualquier namespace (solventa, solventa-observability)
# puede referenciarlo por `secretStoreRef.kind: ClusterSecretStore`.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: solventa-secretstore
  labels:
    app.kubernetes.io/part-of: solventa
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
