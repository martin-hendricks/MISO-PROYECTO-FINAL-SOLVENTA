# ms-polizas — ciclo de vida de pólizas (Grupo B)
#
# Redundancia ACTIVA (EC-LAT-10: p95 <= 150 ms de lectura): las consultas de
# lectura se separan explícitamente hacia el reader endpoint de la réplica de
# RDS, mientras las escrituras van al writer. El código (app/infrastructure/
# sql.py) ya usa dos motores SQLAlchemy -- DATABASE_URL (escritura) y
# DATABASE_URL_READ (lectura) -- aunque hoy ambas apuntan al mismo secreto:
# separarlas de verdad es un cambio de infraestructura (reader_endpoint real
# de rds_polizas), no de código. Volumen de tráfico alto porque lo consultan
# suscripción, siniestros y los BFFs.

nombre: ms-polizas

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-ms-polizas"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 3
grupoEscalado: "b"

puerto: 8080
puertoMetricas: 9090

recursos:
  # Bajado de 512Mi/1Gi: con la cuota real de vCPU de la cuenta (16, ver
  # terraform.tfvars del ambiente minimo), el Node Group B solo puede sostener
  # 5 nodos t3.small -- los 7 servicios de este grupo en reposo con 512Mi
  # cada uno dejaban ~95% de memoria reservada sin margen para un rolling
  # update (confirmado: FailedScheduling "Insufficient memory" en todos los
  # nodos durante un deploy). 300Mi deja margen real; subir junto con
  # node_group_b_instance_types si hace falta representar carga real.
  requests:
    cpu: "400m"
    memory: "300Mi"
  limits:
    cpu: "1000m"
    memory: "600Mi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 5
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 3
  maxReplicas: 10
  targetCPU: 65
  targetMemory: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 75
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    # Solo se proyecta database_url (no username/password/host/port por
    # separado): la app (apps/backend/ms-polizas/app/config.py) espera una
    # única variable DATABASE_URL, igual que ms-cotizacion/ms-siniestros.
    - nombreRemoto: solventa-minimo-polizas-db-credentials
      nombreLocal: ms-polizas-db
      claves:
        - database_url

serviceAccount:
  crear: true
  nombre: ms-polizas
  roleArn: ""

podDisruptionBudget:
  habilitado: true
  minAvailable: 2

topologySpread:
  habilitado: true
  maxSkew: 1

variablesEntornoSecreto:
  - nombre: DATABASE_URL
    nombreSecreto: ms-polizas-db
    claveSecreto: database_url
  # EC-LAT-10 (p95 <= 150 ms de lectura): el código ya separa el motor de
  # lectura (apps/backend/ms-polizas/app/infrastructure/sql.py,
  # crear_motor_lectura) y lo usa en los endpoints que solo consultan.
  # DATABASE_URL_READ apunta al mismo secreto/valor que DATABASE_URL hasta
  # que exista la réplica real de rds_polizas -- separar esto de verdad es
  # un cambio de infraestructura (apuntar a su reader endpoint), no de
  # código.
  - nombre: DATABASE_URL_READ
    nombreSecreto: ms-polizas-db
    claveSecreto: database_url
