# Mismo patrón que infra/k8s/charts/microservicio/templates/externalsecret.yaml
# (ExternalSecret -> ClusterSecretStore "solventa-secretstore" ya existente),
# pero fuera del chart genérico porque Grafana no es uno de los 14
# microservicios de negocio. El secreto remoto
# "solventa-minimo-grafana-admin" lo crea
# infra/terraform/modules/secrets/main.tf, mismo patrón que bff_web_token.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: solventa-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: solventa-secretstore
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: solventa-minimo-grafana-admin
