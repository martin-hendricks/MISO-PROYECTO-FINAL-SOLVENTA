coverage:
  status:
    # Cobertura mínima exigida: 80 %. Por debajo de ese valor el check falla.
    project:
      default:
        target: 80%
      # Backend uploads one flag per service (backend-<service>), so this
      # status groups them by path instead of by flag.
      backend:
        paths:
          - apps/backend/
        target: 80%
      web:
        flags:
          - web
        target: 80%
      mobile:
        flags:
          - mobile
        target: 80%
    # El código nuevo o modificado en el PR también debe tener al menos 80 %.
    patch:
      default:
        target: 80%

# Karma writes lcov paths relative to apps/web (src/app/...).
fixes:
  - "src/app/::apps/web/src/app/"

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    # Legacy flag from before the per-service uploads. Not carried forward so
    # its stale report does not mix with the backend-<service> flags.
    - name: backend
      paths:
        - apps/backend/.*
      carryforward: false
    - name: web
      paths:
        - apps/web/.*
      carryforward: true
    - name: mobile
      paths:
        - apps/mobile/.*
      carryforward: true

# Compose screens and MainActivity run on device. Connected tests cover them;
# the unit-test JaCoCo report excludes the same files.
ignore:
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/MainActivity.kt"
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/ui/shell/CustomerShell.kt"
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/ui/shell/SplashScreen.kt"
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/ui/region/IdiomaRegionScreen.kt"
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/ui/region/IdiomaRegionSheet.kt"
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/ui/shell/PerfilScreen.kt"
  - "apps/mobile/Solventa/app/src/main/java/com/grupo8_uniandes/solventa/SolventaApp.kt"
  - "infra/**"
