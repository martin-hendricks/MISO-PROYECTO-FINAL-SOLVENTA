[project]
name = "bff-arquetipo"
version = "0.1.0"
description = "Arquetipo de Backend for Frontend de Solventa (borde de canal, sin base de datos)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1.0",
  "prometheus-client>=0.21,<1.0",
  "solventa-seguridad @ {root:parent:uri}/libs/solventa-seguridad",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: excluida del workflow unitario",
  "contract: verificación Pact (HU-88); excluida del workflow unitario",
]

[tool.coverage.run]
branch = true
source = ["app"]
