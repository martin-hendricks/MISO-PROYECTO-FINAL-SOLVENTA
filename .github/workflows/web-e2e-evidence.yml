name: Web E2E Evidence (manual)
run-name: "[Web evidence] ${{ github.ref_name }} ${{ inputs.tags }}"

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to run, e.g. @backoffice or @HU-103 (empty runs every active scenario)'
        required: false
        default: ''
        type: string
      retention-days:
        description: 'Days to keep the evidence'
        required: false
        default: 30
        type: number

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    outputs:
      suffix: ${{ steps.suffix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Name the evidence
        id: suffix
        run: echo "value=${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
        env:
          CHROME_BIN: ${{ env.CHROME_BIN }}
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-unit-coverage-${{ steps.suffix.outputs.value }}
          path: apps/web/coverage
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and start the nginx image
        working-directory: .
        run: |
          docker build -t solventa-web apps/web
          docker run -d --name solventa-web -p 8080:80 solventa-web
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/ >/dev/null && exit 0
            sleep 1
          done
          docker logs solventa-web
          exit 1
      - name: Run Cucumber
        run: |
          if [ -n "$TAGS" ]; then
            pnpm e2e --tags "$TAGS"
          else
            pnpm e2e
          fi
        env:
          BASE_URL: http://localhost:8080
          TAGS: ${{ inputs.tags }}
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-evidence-${{ needs.unit-tests.outputs.suffix }}
          path: apps/web/e2e/reports
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore
