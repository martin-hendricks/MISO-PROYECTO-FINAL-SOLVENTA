# ms-consentimiento — consentimiento y habeas data (Grupo B)
#
# Se interpone como gate en toda salida hacia Open Finance: valida que exista
# consentimiento vigente antes de dejar pasar la llamada de ms-cotizacion o
# ms-perfilamiento. Es liviano (una validación de estado, sin cómputo pesado)
# pero debe estar siempre disponible porque bloquea el camino crítico de
# cotización; por eso PDB con minAvailable >= 1 y un mínimo de réplicas
# razonable pese a su bajo consumo de CPU.

nombre: ms-consentimiento

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-ms-consentimiento"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 1
grupoEscalado: "b"

puerto: 8080
puertoMetricas: 8080

recursos:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 1
  maxReplicas: 8
  targetCPU: 70
  targetMemory: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

externalSecrets:
  # ms-consentimiento tiene su propio esquema (db/01_ms_consentimiento.sql,
  # CREATE SCHEMA ms_consentimiento) pero, igual que analitica/notificaciones,
  # sin instancia RDS propia -- vive en DBCompartida (ver
  # infra/terraform/modules/secrets/main.tf, compartida_db_credentials:
  # "...identidad, consentimiento, pagos...", y outputs.tf). El workflow de
  # CD detecta el paso de migraciones por la carpeta db/ existente y espera
  # un ExternalSecret llamado exactamente "<servicio>-db"
  # (.github/workflows/deploy.yml); sin esta entrada el Job de migraciones
  # fallaba en kubectl wait (ExternalSecret inexistente) y el pod tampoco
  # tenía DATABASE_URL para arrancar -- mismo gap ya corregido en
  # analitica.yaml/notificaciones.yaml.
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    - nombreRemoto: solventa-minimo-compartida-db-credentials
      nombreLocal: ms-consentimiento-db
      claves:
        - database_url
    # Sin esto, app/seguridad.py::_secret() lanza HTTPException(500,
    # "SOLVENTA_TOKEN_SECRET no configurado") en toda llamada autenticada --
    # mismo bug ya encontrado y corregido en ms-suscripcion/ms-pagos. Mismo
    # secreto compartido que ms-polizas/ms-identidad/bff-web; sin `claves`
    # porque su única clave ya se llama SOLVENTA_TOKEN_SECRET.
    - nombreRemoto: solventa-minimo-bff-web-token
      nombreLocal: ms-consentimiento-token

serviceAccount:
  crear: true
  nombre: ms-consentimiento
  roleArn: ""

podDisruptionBudget:
  habilitado: true
  minAvailable: 1

topologySpread:
  habilitado: true
  maxSkew: 1

variablesEntorno:
  # El Service de ms-identidad escucha en 8080; sin el puerto explícito el
  # cliente HTTP apunta al 80 y nunca conecta.
  - nombre: MS_IDENTIDAD_URL
    valor: "http://ms-identidad.solventa.svc.cluster.local:8080"

variablesEntornoSecreto:
  - nombre: DATABASE_URL
    nombreSecreto: ms-consentimiento-db
    claveSecreto: database_url
