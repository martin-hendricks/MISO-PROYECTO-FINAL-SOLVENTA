# bff-movil — BFF de la app Android (Grupo B)
#
# Análogo a bff-web pero para el cliente móvil: payloads más pequeños y
# adaptados a conexiones intermitentes. Recibe tráfico del ALB. Recursos y
# HPA muy similares a bff-web; se mantiene como archivo separado porque
# evoluciona a un ritmo distinto (versión de API móvil vs. web).

nombre: bff-movil

imagen:
  repositorio: "<account>.dkr.ecr.us-east-1.amazonaws.com/solventa-minimo-bff-movil"
  tag: ""  # TODO: tag de imagen — se fija en el pipeline de CI/CD
  pullPolicy: IfNotPresent

replicas: 2
grupoEscalado: "b"

# apps/backend/bff-movil/Dockerfile expone y arranca uvicorn en 8000.
puerto: 8000
puertoMetricas: 8000

recursos:
  # Bajado de 384Mi/768Mi: con la cuota real de vCPU de la cuenta (16, ver
  # terraform.tfvars del ambiente minimo), el Node Group B solo puede sostener
  # 5 nodos t3.small -- bff-movil no se había ajustado a este ambiente igual
  # que ms-pagos/ms-polizas/ms-suscripcion/ms-identidad/ms-siniestros, y su
  # footprint (2 réplicas x 384Mi) agotaba el margen que esos 5 ya habían
  # dejado, volviendo a producir FailedScheduling "Insufficient memory"
  # durante un rollout. 300Mi deja margen real; subir junto con
  # node_group_b_instance_types si hace falta representar carga real.
  requests:
    cpu: "250m"
    memory: "300Mi"
  limits:
    cpu: "600m"
    memory: "600Mi"

probes:
  # bff-movil expone un único endpoint /health, igual que bff-web.
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
  startup:
    habilitado: false

hpa:
  habilitado: true
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 65
  targetMemory: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

# SOLVENTA_TOKEN_SECRET firma los JWT de sesión que bff-movil emite
# (app/dependencies.py) -- sin esto, cualquier ruta de sesión responde 500
# "SOLVENTA_TOKEN_SECRET no configurado" (confirmado en producción: POST
# /bff-movil/v1/sesion/ingreso). Tiene que ser el mismo secreto que
# bff-web y que ms-polizas/ms-cotizacion/ms-identidad/ms-siniestros
# (solventa-minimo-bff-web-token): el BFF reenvía el JWT del cliente y
# esos servicios lo verifican con esa clave. Un secreto propio hace que
# el ingreso funcione y GET /cliente/polizas responda 401
# {"detail":{"detail":"Token invalido"}}.
externalSecrets:
  habilitado: true
  secretStoreRef: solventa-secretstore
  remoteSecrets:
    - nombreRemoto: solventa-minimo-bff-web-token
      nombreLocal: bff-movil-token
      # Sin `claves`: se usa dataFrom.extract (ver mismo comentario en
      # infra/k8s/values/bff-web.yaml).

serviceAccount:
  crear: true
  nombre: bff-movil
  roleArn: ""

podDisruptionBudget:
  habilitado: true
  minAvailable: 1

topologySpread:
  habilitado: true
  maxSkew: 1

# Mismo bug y mismo fix que infra/k8s/values/bff-web.yaml: httpx asume el
# puerto 80 por defecto sin uno explícito en la base_url, y ningún Service
# de este chart lo expone (todos escuchan en :8080, o :8000 para
# ms-cotizacion/bff-*). app/clients/nucleo.py (SERVICIOS) lee las 8
# variables; faltaban MS_PAGOS_URL/MS_PERFILAMIENTO_URL/MS_SINIESTROS_URL
# por completo -- sin ellas, _base() responde 503 "no configurado" para
# cualquier ruta que las use.
variablesEntorno:
  - nombre: MS_IDENTIDAD_URL
    valor: "http://ms-identidad.solventa.svc.cluster.local:8080"
  - nombre: MS_COTIZACION_URL
    valor: "http://ms-cotizacion.solventa.svc.cluster.local:8000"
  - nombre: MS_POLIZAS_URL
    valor: "http://ms-polizas.solventa.svc.cluster.local:8080"
  - nombre: MS_SUSCRIPCION_URL
    valor: "http://ms-suscripcion.solventa.svc.cluster.local:8080"
  - nombre: MS_PAGOS_URL
    valor: "http://ms-pagos.solventa.svc.cluster.local:8080"
  - nombre: MS_PERFILAMIENTO_URL
    valor: "http://ms-perfilamiento.solventa.svc.cluster.local:8080"
  - nombre: MS_SINIESTROS_URL
    valor: "http://ms-siniestros.solventa.svc.cluster.local:8080"
  # HU-119/avisos/token: bff-movil llama a notificaciones (WU-01/02/03) para
  # pedir pólizas por vencer y registrar el token de push del dispositivo.
  - nombre: MS_NOTIFICACIONES_URL
    valor: "http://notificaciones.solventa.svc.cluster.local:8080"
